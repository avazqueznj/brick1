
; -------- common flags applied to all envs --------
[env]
; LOCK THE PLATFORM AND FRAMEWORK VERSIONS
platform = ststm32@19.4.0
framework = arduino
build_unflags = -fno-exceptions --specs=nano.specs
build_flags = 
    -fexceptions 
    -DPIO_FRAMEWORK_ARDUINO_ENABLE_EXCEPTIONS 
    -DLV_LAYOUT_NONE=0
platform_packages =
    framework-arduino-mbed @ 4.4.1

; -------- normal serial upload env --------
[env:giga_r1_USB]
board = giga_r1_m7
monitor_speed = 115200
board_build.arduino.flash_layout = 100_0
board_upload.maximum_size = 1900544

; -------- DFU upload env --------
[env:giga_DFU]
board = giga_r1_m7
upload_protocol = dfu
monitor_speed = 115200
board_build.arduino.flash_layout = 100_0
board_upload.maximum_size = 1900544

; -------- ST-Link upload/debug env --------
[env:giga_DEBUG]
board = giga_r1_m7
upload_protocol = stlink
debug_tool = stlink
monitor_speed = 115200
board_build.arduino.flash_layout = 100_0
board_upload.maximum_size = 1900544